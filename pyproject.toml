[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackmamba-mengine"
version = "0.1.0"
description = "Closed-loop autonomous music engineering research platform."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Iyari Gomez" }
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "librosa>=0.10.2",
  "pydantic>=2.8",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11"
]

[project.scripts]
mengine-doctor = "mengine.doctor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
